x-local-storage-env: &local-storage-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-gmotionlocal}
  AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:?Set LOCAL_S3_SECRET_KEY in .env}
  S3_BUCKET_DOCUMENTS: gmotion-docs-dev
  S3_BUCKET_BACKUPS: gmotion-backups-dev
  S3_ENDPOINT: http://storage:9090
  S3_PUBLIC_ENDPOINT: ${LOCAL_S3_PUBLIC_ENDPOINT:-http://localhost:9000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9000:9090"
    volumes:
      - local_storage:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 15

  storage-init:
    build:
      context: ./backend/
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      <<: *local-storage-env
      APP_ENV: development
    command: ["go", "run", "./cmd/localstorage"]
    depends_on:
      storage:
        condition: service_healthy

  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *local-storage-env
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      APP_ENV: development
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    stop_grace_period: 10s
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${APP_PORT}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_next:/app/.next
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_tmp:
  go_modules:
  go_build_cache:
  frontend_next:
  local_storage:
