version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "queries/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        sql_package: "pgx/v5"
        overrides:
          - column: "dealer_stats.total_amount_to_company"
            go_type: "github.com/jackc/pgx/v5/pgtype.Numeric"
          - column: "dealer_stats.avg_days_to_payment"
            go_type: "github.com/jackc/pgx/v5/pgtype.Numeric"
          - column: "broker_stats.total_broker_commission"
            go_type: "github.com/jackc/pgx/v5/pgtype.Numeric"
          - column: "broker_stats.total_broker_fee"
            go_type: "github.com/jackc/pgx/v5/pgtype.Numeric"
          - column: "broker_stats.company_net_income"
            go_type: "github.com/jackc/pgx/v5/pgtype.Numeric"
