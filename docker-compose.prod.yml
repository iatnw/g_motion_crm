services:
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes: []  # no source mount in prod — binary is baked into the image

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile.prod
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL}
    restart: unless-stopped
    volumes: []  # no source mount in prod
