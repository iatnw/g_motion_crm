services:
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile.prod
    env_file: .env
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_PORT}"

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
