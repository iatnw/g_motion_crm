services:
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile.prod
    env_file: .env
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${APP_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
